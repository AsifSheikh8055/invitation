<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- EDIT: title and description (shown in Google and WhatsApp link previews) -->
<title>Mubarak Invites | Digital Wedding Invitations</title>
<meta name="description" content="Beautiful animated wedding invitations for ₹499, with your own link to share on WhatsApp.">
<meta property="og:title" content="Mubarak Invites | Digital Wedding Invitations">
<meta property="og:description" content="Beautiful animated wedding invitations for ₹499, with your own link to share on WhatsApp.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Great+Vibes&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--deep:#0a1e36;--navy:#0f2744;--card:#14335a;--gold:#c9a84c;--pale:#e8d08c;--cream:#faf3e0;--mute:rgba(255,255,255,.72)}
*{box-sizing:border-box;margin:0}
body{background:linear-gradient(180deg,var(--deep),var(--navy));color:#fff;font:20px/1.7 'Cormorant Garamond',Georgia,serif;text-align:center;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:0 22px}
section{padding:44px 0;border-top:1px solid rgba(201,168,76,.2)}
.hero{border:0;padding:72px 0 48px}
.script{font:clamp(2.6rem,11vw,4.2rem)/1.15 'Great Vibes',cursive;color:var(--pale)}
.sans{font-family:'Montserrat',sans-serif;text-transform:uppercase;letter-spacing:.16em;font-weight:600}
.tag{margin-top:10px;color:var(--mute);font-style:italic;font-size:1.15rem}
h2{font-size:clamp(1.7rem,5vw,2.3rem);color:var(--cream);margin-bottom:16px;font-weight:600}
p{color:var(--mute)}
p+p{margin-top:12px}
ul{list-style:none;padding:0;display:grid;gap:10px;max-width:520px;margin:0 auto;text-align:left}
li{padding-left:28px;position:relative;color:var(--mute)}
li::before{content:"✦";position:absolute;left:0;color:var(--gold);font-size:.85em;top:.15em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;margin-top:8px}
.pkg{background:rgba(250,243,224,.05);border:1px solid rgba(201,168,76,.3);border-radius:14px;padding:28px 20px}
.pkg h3{font:600 .62rem 'Montserrat',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--pale)}
.price{font-size:2.3rem;color:var(--cream);margin:6px 0;line-height:1.2}
.note{font-size:.95rem;color:var(--gold);font-style:italic;margin-bottom:14px}
.pkg ul{font-size:1rem;gap:6px}
.steps{counter-reset:s;display:grid;gap:14px;max-width:520px;margin:0 auto;text-align:left}
.steps div{counter-increment:s;padding-left:46px;position:relative;color:var(--mute)}
.steps div::before{content:counter(s);position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;border:1px solid var(--gold);color:var(--pale);font:600 .8rem/30px 'Montserrat',sans-serif;text-align:center}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:20px}
.btn{display:inline-block;padding:13px 28px;border-radius:999px;border:1px solid rgba(201,168,76,.5);color:var(--pale);text-decoration:none;font:600 .62rem 'Montserrat',sans-serif;letter-spacing:.15em;text-transform:uppercase;background:rgba(250,243,224,.06);transition:all .3s}
.btn:hover{background:rgba(201,168,76,.18)}
.btn.main{background:linear-gradient(135deg,#a07b2e,var(--gold));color:var(--deep);border-color:transparent;box-shadow:0 4px 20px rgba(201,168,76,.35)}
:focus-visible{outline:2px solid var(--pale);outline-offset:3px}
footer{padding:36px 22px 48px;font-size:.95rem;color:rgba(255,255,255,.45)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <section class="hero">
    <p class="sans" style="font-size:.6rem;color:var(--gold)">Digital wedding invitations</p>
    <h1 class="script" id="brand"></h1>
    <p class="tag" id="tagline"></p>
    <div class="btns"><a class="btn main" id="waTop" target="_blank" rel="noopener">Message on WhatsApp</a>
    <a class="btn" id="sample">See a sample invitation</a></div>
  </section>

  <section><h2>About me</h2><div id="about"></div></section>
  <section><h2>What you get</h2><ul id="included"></ul></section>
  <section><h2>Price</h2><div class="grid" id="packages"></div><p id="priceNote" style="margin-top:18px;font-size:.95rem"></p></section>
  <section><h2>How it works</h2><div class="steps" id="steps"></div></section>
  <section><h2>Get in touch</h2><p id="contactLine"></p>
    <div class="btns"><a class="btn main" id="wa" target="_blank" rel="noopener">WhatsApp</a>
    <a class="btn" id="ig" target="_blank" rel="noopener" hidden>Instagram</a>
    <a class="btn" id="call" hidden>Call</a></div></section>
</main>
<footer id="foot"></footer>

<script>
/* ============ EDIT ONLY THIS BLOCK ============ */
const C = {
  brand: "Mubarak Invites",                         // your name or business name
  tagline: "Your wedding, beautifully invited in one link",
  about: [
    "I make beautiful digital invitations for Nikah, Walima and other family events.",
    "You send me your details, and I turn them into a link that you can share with family and friends on WhatsApp. It is simple, quick and fairly priced."
  ],
  included: [                                       // one line each, add or delete freely
    "Opening doors animation when your guests open the link",
    "Names, date, time and venue, written the way you want",
    "Live countdown to your event",
    "Google Maps button so guests can find the venue easily",
    "Quran verse section",
    "Your own link to share, with a preview picture",
    "Works smoothly on every phone"
  ],
  packages: [                                       // add or delete packages freely
    { name: "Standard Invitation", price: "₹499", note: "Everything listed above is included",
      features: ["Opening doors animation", "Names, date, time and venue", "Countdown and Google Maps button", "Quran verse section", "Your own link with a preview picture"] },
    { name: "Custom Changes", price: "Ask me", note: "Extra charges apply",
      features: ["Extra events like Mehendi or Reception", "Music or other special requests", "Message me on WhatsApp for a quote"] }
  ],
  priceNote: "Want something extra, like more events or music? Extra charges apply, so please connect with me on WhatsApp.",
  steps: [
    "Message me on WhatsApp and tell me you would like an invitation like the sample.",
    "Send me the names, date, time, venue and family details.",
    "I send you a preview. We change anything you want.",
    "You get your final link to share with your guests."
  ],
  contactLine: "Tell me about your wedding and I will reply with the details.",
  whatsapp: "919156854860",                         // country code + number, no + or spaces
  phone: "",                                        // optional, example: +919156854860 (leave empty to hide)
  instagram: "",                                    // optional, handle without @ (leave empty to hide)
  sample: "./index.html",                           // link to the sample invitation
  waText: "Assalamu Alaikum! I saw your sample invitation and I would like to make one for my wedding."
};
/* ============================================== */

const $ = id => document.getElementById(id);
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; };
document.title = C.brand + " | Digital Wedding Invitations";
$("brand").textContent = C.brand; $("tagline").textContent = C.tagline;
C.about.forEach(t => $("about").append(el("p", t)));
C.included.forEach(t => $("included").append(el("li", t)));
C.packages.forEach(p => {
  const d = el("div", undefined, "pkg"), u = el("ul");
  p.features.forEach(f => u.append(el("li", f)));
  d.append(el("h3", p.name), el("div", p.price, "price"), el("p", p.note, "note"), u);
  $("packages").append(d);
});
$("priceNote").textContent = C.priceNote;
C.steps.forEach(t => $("steps").append(el("div", t)));
$("contactLine").textContent = C.contactLine;
const wa = "https://wa.me/" + C.whatsapp + "?text=" + encodeURIComponent(C.waText);
$("wa").href = wa; $("waTop").href = wa; $("sample").href = C.sample;
if (C.instagram) { $("ig").href = "https://www.instagram.com/" + C.instagram + "/"; $("ig").hidden = false; }
if (C.phone) { $("call").href = "tel:" + C.phone; $("call").hidden = false; }
$("foot").textContent = C.brand;
</script>
</body>
</html>
